<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Detectives - Live Simulation</title>
    <style>
        :root {
            --ig-bg: #fafafa;
            --ig-header: #ffffff;
            --ig-border: #dbdbdb;
            --ig-text: #262626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .phone-frame {
            width: 380px;
            height: 650px;
            background: var(--ig-bg);
            border-radius: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 12px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            background-color: var(--ig-header);
            color: var(--ig-text);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--ig-border);
            z-index: 10;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .header-info h3 {
            margin: 0;
            font-size: 15px;
        }

        .header-info p {
            margin: 2px 0 0 0;
            font-size: 11px;
            color: #8e8e8e;
        }

        .chat-body {
            flex: 1;
            background-color: #ffffff;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-box {
            background: #f0f2f5;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            border: 1px solid var(--ig-border);
        }
        .post-img {
            font-size: 32px;
            margin-bottom: 5px;
        }
        .post-caption {
            font-size: 13px;
            font-weight: bold;
            color: var(--ig-text);
        }

        .comment {
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 3px solid #3b82f6;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .comment-sender {
            font-weight: bold;
            font-size: 12px;
            color: #0284c7;
            margin-bottom: 3px;
            display: block;
        }

        .timestamp {
            font-size: 10px;
            color: #94a3b8;
            float: right;
        }

        .typing-indicator {
            align-self: flex-start;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: #64748b;
            font-style: italic;
            display: none;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-play { background-color: #22c55e; color: white; }
        .btn-pause { background-color: #eab308; color: white; }
        .btn-reset { background-color: #ef4444; color: white; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="chat-header">
            <div class="avatar">🎨</div>
            <div class="header-info">
                <h3>@nour_arts (Public Post)</h3>
                <p id="group-status">Tap Start Simulation</p>
            </div>
        </div>

        <div class="chat-body" id="chatContainer">
            <div class="post-box">
                <div class="post-img">🖼️🤖</div>
                <div class="post-caption">"My 3D robot project model for the school tech exhibition!"</div>
            </div>
            <div class="typing-indicator" id="typingIndicator">New comment incoming...</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-play" onclick="startSimulation()">▶️ Start / Resume</button>
        <button class="btn-pause" onclick="pauseSimulation()">⏸️ Pause</button>
        <button class="btn-reset" onclick="resetSimulation()">🔄 Reset</button>
    </div>

    <script>
        // سكريبت واقعي يوضح ردود الفعل البشرية الحقيقية (من غير سرد جامد بين قوسين)
        const script = [
            { sender: "Ziad", text: "Lol is this made out of garbage? Looks terrible 🗑️😂", time: "10m ago", delay: 1500 },
            { sender: "Karim", text: "Hahaha bro spent 5 minutes on this 💀", time: "8m ago", delay: 2500 },
            { sender: "Youssef", text: "👀", time: "6m ago", delay: 1800 }, // يوسف دخل وشاف وبعت عيون من غير ما يتكلم
            { sender: "Hana", text: "Why would anyone post this publicly? Cringe 😬", time: "5m ago", delay: 2000 },
            { sender: "Nour (Creator)", text: "I worked on it for three days... please stop.", time: "1m ago", delay: 2500 },
            { sender: "Ziad", text: "Take a joke, snowflake ❄️😂", time: "Just now", delay: 2000 }
        ];

        let currentIndex = 0;
        let isRunning = false;
        let timeoutId = null;

        const chatContainer = document.getElementById('chatContainer');
        const typingIndicator = document.getElementById('typingIndicator');
        const groupStatus = document.getElementById('group-status');

        function showNextMessage() {
            if (currentIndex >= script.length || !isRunning) {
                typingIndicator.style.display = 'none';
                groupStatus.innerText = currentIndex >= script.length ? "Simulation Finished" : "Paused";
                return;
            }

            const msg = script[currentIndex];
            groupStatus.innerText = `New comment loading...`;
            typingIndicator.style.display = 'block';
            chatContainer.appendChild(typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            timeoutId = setTimeout(() => {
                typingIndicator.style.display = 'none';

                const commentDiv = document.createElement('div');
                commentDiv.className = `comment`;

                commentDiv.innerHTML = `
                    <span class="comment-sender">${msg.sender} <span class="timestamp">${msg.time}</span></span>
                    <div>${msg.text}</div>
                `;

                chatContainer.appendChild(commentDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                currentIndex++;
                showNextMessage();
            }, msg.delay);
        }

        function startSimulation() {
            if (!isRunning && currentIndex < script.length) {
                isRunning = true;
                showNextMessage();
            }
        }

        function pauseSimulation() {
            isRunning = false;
            clearTimeout(timeoutId);
            typingIndicator.style.display = 'none';
            groupStatus.innerText = "Paused";
        }

        function resetSimulation() {
            pauseSimulation();
            currentIndex = 0;
            chatContainer.innerHTML = `
                <div class="post-box">
                    <div class="post-img">🖼️🤖</div>
                    <div class="post-caption">"My 3D robot project model for the school tech exhibition!"</div>
                </div>
                <div class="typing-indicator" id="typingIndicator">New comment incoming...</div>
            `;
            groupStatus.innerText = "Tap Start Simulation";
        }
    </script>
</body>
</html>
